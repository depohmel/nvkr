    name: 'Build and package producer evidence for nvke-node-image-amd64'
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 1045
    needs: [nvkr-nvke-node-image-amd64-fetch-nvke-age-693f047a753d, nvkr-nvke-node-image-amd64-fetch-nvke-cni-calico, nvkr-nvke-node-image-amd64-fetch-nvke-cni-ovn, nvkr-nvke-node-image-amd64-fetch-nvke-kubeadm-distro, nvkr-nvke-node-image-amd64-fetch-nvke-spire-agent, nvkr-nvke-node-image-amd64-fetch-ovn-kube-ubuntu, nvkr-nvke-node-image-amd64-fetch-ovn-kubernetes-chart]
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    environment: 'nvkr-release'
    permissions:
      actions: read
      contents: read
    steps:
      - *check-native-linux-amd64
      - name: Admit hosted AMD64 provider, disk capacity and KVM access
        timeout-minutes: 1
        run: |-
          set -eu
          if [ "${RUNNER_ENVIRONMENT:-}" != github-hosted ] || [ "$(uname -s)/$(uname -m)" != Linux/x86_64 ]; then
            printf 'NVKR-E-ENGINE-CAPABILITY: native-amd64-v1 requires an actual GitHub-hosted AMD64 runner\n' >&2
            exit 29
          fi
          if ! cpu_count=$(nproc) ||
             ! memory_mib=$(awk '$1 == "MemAvailable:" { print int($2 / 1024); found=1 } END { if (!found) exit 1 }' /proc/meminfo) ||
             ! disk_report=$(df -Pm .) ||
             ! storage_mib=$(printf '%s\n' "$disk_report" | awk 'NR == 2 { print $4; found=1 } END { if (!found) exit 1 }'); then
            printf 'NVKR-E-ENGINE-CAPABILITY: cannot observe hosted disk capacity\n' >&2
            exit 29
          fi
          case "$cpu_count:$memory_mib:$storage_mib" in
            *[!0-9:]*|:*|*::*|*:) printf 'NVKR-E-ENGINE-CAPABILITY: invalid hosted disk capacity observation\n' >&2; exit 29 ;;
          esac
          cpu_millis=$((cpu_count * 1000))
          printf 'Hosted disk preflight: CPU %s/4000 milliCPU, memory %s/10240 MiB, scratch %s/65536 MiB\n' "$cpu_millis" "$memory_mib" "$storage_mib"
          if ! [ "$cpu_millis" -ge 4000 ] || ! [ "$memory_mib" -ge 10240 ] || ! [ "$storage_mib" -ge 65536 ]; then
            printf 'NVKR-E-ENGINE-CAPABILITY: hosted disk class capacity unavailable before transfer\n' >&2
            exit 29
          fi
          set -eu
          if [ -L /dev/kvm ] || [ ! -c /dev/kvm ]; then
            printf 'NVKR-E-ENGINE-CAPABILITY: native disk runner lacks /dev/kvm\n' >&2
            exit 29
          fi
          if ! (exec 3<>/dev/kvm && exec 3>&-) 2>/dev/null; then
            printf 'Preparing /dev/kvm access on the GitHub-hosted runner\n'
            if ! /usr/bin/timeout --kill-after=5s 15s /usr/bin/sudo -n -- /usr/bin/chmod 0666 /dev/kvm; then
              printf 'NVKR-E-ENGINE-CAPABILITY: unable to prepare /dev/kvm access\n' >&2
              exit 29
            fi
          fi
          if ! (exec 3<>/dev/kvm && exec 3>&-); then
            printf 'NVKR-E-ENGINE-CAPABILITY: runner still cannot open /dev/kvm read/write\n' >&2
            id >&2 || true
            stat -c 'uid=%u gid=%g mode=%a' /dev/kvm >&2 || true
            exit 29
