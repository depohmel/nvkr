---
# Diagnostic branch only. No product inputs, credentials or artifact uploads.
name: Hosted VM capability probe
'on':
  push:
    branches: [codex/hosted-arm64-probe]
permissions: {}
concurrency:
  group: nvkr-hosted-arm64-probe
  cancel-in-progress: true
jobs:
  probe:
    if: github.repository == 'depohmel/nvkr'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            arch: aarch64
            qemu: qemu-system-aarch64
            package: qemu-system-arm
            machine: virt
          - runner: ubuntu-24.04
            arch: x86_64
            qemu: qemu-system-x86_64
            package: qemu-system-x86
            machine: q35
    env:
      PROBE_ARCH: ${{ matrix.arch }}
      PROBE_QEMU: ${{ matrix.qemu }}
      PROBE_PACKAGE: ${{ matrix.package }}
      PROBE_MACHINE: ${{ matrix.machine }}
    steps:
      - name: Check native VM host capacity
        run: |
          set -euo pipefail
          failed=0
          if [[ $(uname -s) != Linux || $(uname -m) != "$PROBE_ARCH" ]]; then
            echo '::error::The probe requires the selected native Linux architecture.'
            failed=1
          fi
          available_mib=$(awk '/^MemAvailable:/ {print int($2 / 1024)}' /proc/meminfo)
          disk_mib=$(df -Pm "$RUNNER_TEMP" | awk 'NR == 2 {print $4}')
          printf 'Available RAM: %s MiB; free disk: %s MiB\n' "$available_mib" "$disk_mib"
          # Match the existing candidate suite admission thresholds.
          if [[ -z "$available_mib" || "$available_mib" -lt 24576 ]]; then
            echo '::error::The VM suite requires at least 24576 MiB available RAM.'
            failed=1
          fi
          if [[ -z "$disk_mib" || "$disk_mib" -lt 92160 ]]; then
            echo '::error::The VM suite requires at least 92160 MiB free disk.'
            failed=1
          fi
          exit "$failed"
      - name: Verify actual KVM initialization
        # Inspect KVM even if capacity failed; that failure still fails the job.
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          if [[ $(uname -s) != Linux || $(uname -m) != "$PROBE_ARCH" ]]; then
            echo '::error::The probe requires the selected native Linux architecture.'
            exit 1
          fi
          if [[ ! -c /dev/kvm ]]; then
            echo '::error::No /dev/kvm device exists on this runner.'
            exit 1
          fi
          ls -l /dev/kvm
          # This disposable VM has no product inputs or credentials.
          sudo -n chmod 666 /dev/kvm
          if ! (exec 3<>/dev/kvm); then
            echo '::error::The runner cannot open /dev/kvm after granting access.'
            exit 1
          fi
          if ! command -v "$PROBE_QEMU" >/dev/null; then
            sudo -n timeout --kill-after=10s 180s apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update
            sudo -n timeout --kill-after=10s 300s apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install --no-install-recommends -y "$PROBE_PACKAGE"
          fi
          # A paused empty machine tests KVM initialization, without a product disk or TCG fallback.
          if ! printf 'info status\nquit\n' | timeout --kill-after=5s 30s "$PROBE_QEMU" \
            -machine "$PROBE_MACHINE,accel=kvm" -cpu host -m 256 -nodefaults -nographic \
            -S -monitor stdio -serial none > "$RUNNER_TEMP/nightly-kvm-probe.log" 2>&1; then
            cat "$RUNNER_TEMP/nightly-kvm-probe.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/nightly-kvm-probe.log"
          grep -Fq 'VM status: paused' "$RUNNER_TEMP/nightly-kvm-probe.log"
          echo 'KVM initialization passed. See the separate capacity result; full E2E remains untested.'
