---
name: Measure actual AMD64 builds on standard hosted runners

'on':
  push:
    branches: [codex/hosted-amd64-workload]
    paths:
      - .github/workflows/nvkr-hosted-workload.yml
      - scripts/ci-measure-workload.sh
  workflow_dispatch:
    inputs:
      stage:
        description: Actual workload to measure
        type: choice
        default: both
        options: [both, source, disk]

permissions:
  contents: read

concurrency:
  group: hosted-amd64-workload-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

# Workload sizing experiments only. No publication, signing, Actions caches or
# artifact uploads. Product payloads remain on disposable runner disks.
jobs:
  source-build:
    # The initial branch push already started compilation. Follow-up pushes
    # iterate only the disk job; dispatch can explicitly repeat either stage.
    if: github.event_name == 'workflow_dispatch' && inputs.stage != 'disk'
    name: Actual pinned NVKR source compilation
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Verify actual hosted allocation
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(uname -s)/$(uname -m)" = Linux/x86_64
          nproc
          free -m
          df -Pm .
          docker info --format '{{.OSType}}/{{.Architecture}}'
      - name: Compile the existing source-build test
        run: go test -c -o "$RUNNER_TEMP/nvke-os-source.test" ./pkg/nvkr/buildgraph
      - name: Execute real pinned source builds and validate outputs
        run: |
          set -euo pipefail
          cd pkg/nvkr/buildgraph
          bash ../../../scripts/ci-measure-workload.sh \
            sudo --non-interactive env NVKR_OS_SOURCE_RUNTIME=docker \
              NVKR_OS_SOURCE_COMPONENTS=containerd-2-3-0,cni-plugins-1-6-0,kubernetes-1-34-2 \
              "$RUNNER_TEMP/nvke-os-source.test" \
              -test.run '^TestNVKEOSPublicSourcesLive$' -test.v -test.timeout 75m

  disk-build:
    if: github.event_name == 'push' || inputs.stage != 'source'
    name: Actual pinned NVKE QCOW2 build using KVM
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the exact nightly product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dsx-ai-factory/nvke
          ref: 400c24fb6465b042be883d6b62472528520d6291
          path: nvke
          fetch-depth: 0
          persist-credentials: false
      - name: Verify native hosted KVM allocation
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(uname -s)/$(uname -m)" = Linux/x86_64
          test -c /dev/kvm
          sudo -n chmod 0666 /dev/kvm
          (exec 3<>/dev/kvm)
          nproc
          free -m
          df -Pm .
      - name: Set up container-backed Buildx for archive export
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker-container
      - name: Build and natively validate the existing local Packer toolchain
        id: toolchain
        run: |
          set -euo pipefail
          bash scripts/ci-measure-workload.sh bash -ec '
            image=$(CONTAINER_RUNTIME=docker bash toolchains/nvkr-packer/build.sh \
              --arch amd64 --diagnostic-local --print-validated-image-id)
            printf "image=%s\n" "$image" >> "$GITHUB_OUTPUT"
          '
      - name: Execute the source-owned QCOW2 build without publishing
        env:
          TOOLCHAIN_IMAGE: ${{ steps.toolchain.outputs.image }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/packer-home"
          # Match the native toolchain owner's UID/GID projection. ssh-keygen
          # requires a passwd entry even when Docker accepts a numeric UID.
          printf 'root:x:0:0:root:/root:/bin/sh\nnvkr:x:%s:%s:NVKR Builder:/work:/bin/sh\n' \
            "$(id -u)" "$(id -g)" > "$RUNNER_TEMP/packer-home/passwd"
          printf 'root:x:0:\nnvkr:x:%s:\n' "$(id -g)" > "$RUNNER_TEMP/packer-home/group"
          chmod 0400 "$RUNNER_TEMP/packer-home/passwd" "$RUNNER_TEMP/packer-home/group"
          # The source-owned NVIDIA OVN package build requires Buildx. Reuse
          # the disposable host daemon without mounting registry credentials.
          docker_cli=$(command -v docker)
          buildx=$(docker info --format '{{range .ClientInfo.Plugins}}{{if eq .Name "buildx"}}{{.Path}}{{end}}{{end}}')
          test -x "$docker_cli"
          test -x "$buildx"
          test -S /var/run/docker.sock
          bash scripts/ci-measure-workload.sh \
            docker run --rm --device /dev/kvm --network host \
              --user "$(id -u):$(id -g)" \
              --group-add "$(stat -c %g /var/run/docker.sock)" \
              --volume "$GITHUB_WORKSPACE/nvke:/src" \
              --volume "$RUNNER_TEMP/packer-home:/work" \
              --volume "$RUNNER_TEMP/packer-home/passwd:/etc/passwd:ro" \
              --volume "$RUNNER_TEMP/packer-home/group:/etc/group:ro" \
              --volume "$docker_cli:/usr/local/bin/docker:ro" \
              --volume "$buildx:/usr/local/lib/docker/cli-plugins/docker-buildx:ro" \
              --volume /var/run/docker.sock:/var/run/docker.sock \
              --workdir /src/os-image/packer \
              --env HOME=/work --env CHECKPOINT_DISABLE=1 \
              --env DOCKER_CONFIG=/work/.docker \
              --env PACKER_PLUGIN_PATH=/nvkr/toolchain/packer/plugins \
              --entrypoint make "$TOOLCHAIN_IMAGE" \
                os-image-non-fde ARCH=amd64 ACCELERATOR=kvm REQUIRE_ACCELERATION=1 \
                EXPECTED_SOURCE_COMMIT=400c24fb6465b042be883d6b62472528520d6291
      - name: Verify the actual output disk locally
        env:
          TOOLCHAIN_IMAGE: ${{ steps.toolchain.outputs.image }}
        run: |
          set -euo pipefail
          disk="$GITHUB_WORKSPACE/nvke/os-image/packer/output-non-fde/nvke-node-non-fde-ubuntu-26.04.1-amd64.qcow2"
          test -s "$disk"
          sha256sum "$disk"
          docker run --rm --network none --read-only \
            --volume "$disk:/disk.qcow2:ro" --entrypoint qemu-img "$TOOLCHAIN_IMAGE" info /disk.qcow2
          docker run --rm --network none --read-only \
            --volume "$disk:/disk.qcow2:ro" --entrypoint qemu-img "$TOOLCHAIN_IMAGE" check /disk.qcow2
