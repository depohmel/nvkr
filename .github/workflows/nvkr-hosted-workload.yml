---
name: Measure actual AMD64 builds on standard hosted runners

'on':
  push:
    branches: [codex/hosted-amd64-workload]
    paths:
      - .github/workflows/nvkr-hosted-workload.yml
      - scripts/ci-measure-workload.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-amd64-workload-${{ github.ref }}
  cancel-in-progress: false

# Workload sizing experiments only. No publication, signing, Actions caches or
# artifact uploads. Product payloads remain on disposable runner disks.
jobs:
  source-build:
    name: Actual pinned NVKR source compilation
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Verify actual hosted allocation
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(uname -s)/$(uname -m)" = Linux/x86_64
          nproc
          free -m
          df -Pm .
          docker info --format '{{.OSType}}/{{.Architecture}}'
      - name: Compile the existing source-build test
        run: go test -c -o "$RUNNER_TEMP/nvke-os-source.test" ./pkg/nvkr/buildgraph
      - name: Execute real pinned source builds and validate outputs
        run: |
          set -euo pipefail
          cd pkg/nvkr/buildgraph
          bash ../../../scripts/ci-measure-workload.sh \
            sudo --non-interactive env NVKR_OS_SOURCE_RUNTIME=docker \
              NVKR_OS_SOURCE_COMPONENTS=containerd-2-3-0,cni-plugins-1-6-0,kubernetes-1-34-2 \
              "$RUNNER_TEMP/nvke-os-source.test" \
              -test.run '^TestNVKEOSPublicSourcesLive$' -test.v -test.timeout 75m

  disk-build:
    name: Actual pinned NVKE QCOW2 build using KVM
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the exact nightly product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dsx-ai-factory/nvke
          ref: 400c24fb6465b042be883d6b62472528520d6291
          path: nvke
          fetch-depth: 0
          persist-credentials: false
      - name: Verify native hosted KVM allocation
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(uname -s)/$(uname -m)" = Linux/x86_64
          test -c /dev/kvm
          sudo -n chmod 0666 /dev/kvm
          (exec 3<>/dev/kvm)
          nproc
          free -m
          df -Pm .
      - name: Build and natively validate the existing local Packer toolchain
        id: toolchain
        run: |
          set -euo pipefail
          bash scripts/ci-measure-workload.sh bash -ec '
            image=$(CONTAINER_RUNTIME=docker bash toolchains/nvkr-packer/build.sh \
              --arch amd64 --diagnostic-local --print-validated-image-id)
            printf "image=%s\n" "$image" >> "$GITHUB_OUTPUT"
          '
      - name: Execute the source-owned QCOW2 build without publishing
        env:
          TOOLCHAIN_IMAGE: ${{ steps.toolchain.outputs.image }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/packer-home"
          bash scripts/ci-measure-workload.sh \
            docker run --rm --device /dev/kvm --network host \
              --user "$(id -u):$(id -g)" \
              --volume "$GITHUB_WORKSPACE/nvke:/src" \
              --volume "$RUNNER_TEMP/packer-home:/work" \
              --workdir /src/os-image/packer \
              --env HOME=/work --env CHECKPOINT_DISABLE=1 \
              --env PACKER_PLUGIN_PATH=/nvkr/toolchain/packer/plugins \
              --entrypoint make "$TOOLCHAIN_IMAGE" \
                os-image-non-fde ARCH=amd64 ACCELERATOR=kvm REQUIRE_ACCELERATION=1 \
                EXPECTED_SOURCE_COMMIT=400c24fb6465b042be883d6b62472528520d6291
      - name: Verify the actual output disk locally
        env:
          TOOLCHAIN_IMAGE: ${{ steps.toolchain.outputs.image }}
        run: |
          set -euo pipefail
          disk="$GITHUB_WORKSPACE/nvke/os-image/packer/output-non-fde/nvke-node-non-fde-ubuntu-26.04.1-amd64.qcow2"
          test -s "$disk"
          sha256sum "$disk"
          docker run --rm --network none --read-only \
            --volume "$disk:/disk.qcow2:ro" --entrypoint qemu-img "$TOOLCHAIN_IMAGE" info /disk.qcow2
          docker run --rm --network none --read-only \
            --volume "$disk:/disk.qcow2:ro" --entrypoint qemu-img "$TOOLCHAIN_IMAGE" check /disk.qcow2
