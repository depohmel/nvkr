---
name: NVKR nightly NVKE end-to-end tests

'on':
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      source_contract_only:
        description: Validate the pinned nightly handoff without builds or VM deployment
        type: boolean
        default: false
      hosted_preflight_only:
        description: Probe native KVM on the standard GitHub-hosted AMD64 runner without product artifacts
        type: boolean
        default: false
      profile:
        description: Maintained nightly project to build and test
        type: choice
        required: true
        default: all
        options:
          - all
          - nvke-nightly-amd64
          - nvke-nightly-arm64

permissions:
  contents: read

concurrency:
  group: nvkr-nightly-main
  cancel-in-progress: false

jobs:
  resolve-source:
    if: github.repository == 'dsx-ai-factory/nvkr' && !inputs.hosted_preflight_only
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      nvke_commit: ${{ steps.source.outputs.nvke_commit }}
    steps:
      - name: Resolve NVKE main once for this nightly cycle
        id: source
        env:
          GH_TOKEN: ${{ secrets.NKE_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?NVKE source resolution requires its read credential}"
          source=$(timeout --kill-after=5s 60s gh api --hostname github.com \
            -H 'X-GitHub-Api-Version: 2026-03-10' repos/dsx-ai-factory/nvke/git/ref/heads/main)
          commit=$(jq -er '
            if .ref == "refs/heads/main" and .object.type == "commit" and
              (.object.sha | type == "string" and test("^[0-9a-f]{40}$")) then .object.sha
            else error("invalid exact NVKE main revision") end' <<<"$source")
          printf 'nvke_commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"

  hosted-preflight:
    if: github.event_name == 'workflow_dispatch' && inputs.hosted_preflight_only
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {}
    steps:
      - name: Observe the native hosted AMD64 VM host
        env:
          SOURCE_CONTRACT_ONLY: ${{ inputs.source_contract_only }}
        run: |
          set -euo pipefail
          if [[ "$SOURCE_CONTRACT_ONLY" == true ]]; then
            echo '::error::Select only one diagnostic mode.'
            exit 1
          fi
          failed=0
          if [[ "$RUNNER_ENVIRONMENT" != github-hosted || $(uname -s)/$(uname -m) != Linux/x86_64 ]]; then
            echo '::error::The hosted VM suite requires an actual GitHub-hosted Linux AMD64 runner.'
            failed=1
          fi
          available_mib=$(awk '/^MemAvailable:/ {print int($2 / 1024)}' /proc/meminfo)
          disk_mib=$(df -Pm "$RUNNER_TEMP" | awk 'NR == 2 {print $4}')
          printf 'Available RAM: %s MiB; free disk: %s MiB\n' "$available_mib" "$disk_mib"
          # Observations are not empirically established workload minima.
          [[ "$available_mib" =~ ^[0-9]+$ && "$disk_mib" =~ ^[0-9]+$ ]] || failed=1
          if [[ ! -c /dev/kvm || ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo '::error::The VM suite requires a readable and writable /dev/kvm device.'
            failed=1
          elif ! (exec 3<>/dev/kvm); then
            echo '::error::The runner cannot open /dev/kvm.'
            failed=1
          fi
          exit "$failed"
      - name: Verify actual KVM initialization
        run: |
          set -euo pipefail
          if ! command -v qemu-system-x86_64 >/dev/null; then
            sudo -n timeout --kill-after=10s 180s apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update
            sudo -n timeout --kill-after=10s 300s apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install --no-install-recommends -y qemu-system-x86
          fi
          # Package installation can reset the device mode after the first check.
          if ! (exec 3<>/dev/kvm); then sudo -n timeout --kill-after=5s 15s chmod 0666 /dev/kvm; fi
          # A paused empty machine tests KVM initialization, without a product disk or TCG fallback.
          if ! printf 'info status\nquit\n' | timeout --kill-after=5s 30s qemu-system-x86_64 \
            -machine q35,accel=kvm -cpu host -m 256 -nodefaults -nographic \
            -S -monitor stdio -serial none > "$RUNNER_TEMP/nightly-kvm-probe.log" 2>&1; then
            cat "$RUNNER_TEMP/nightly-kvm-probe.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/nightly-kvm-probe.log"
          grep -Fq 'VM status: paused' "$RUNNER_TEMP/nightly-kvm-probe.log"
          echo 'Hosted KVM initialization passed; resource observations do not prove a full E2E cycle.'

  source-contract:
    needs: [resolve-source]
    if: github.event_name == 'workflow_dispatch' && inputs.source_contract_only && !inputs.hosted_preflight_only && github.repository == 'dsx-ai-factory/nvkr'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out selected adapter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check out the cycle's exact NVKE main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dsx-ai-factory/nvke
          ref: ${{ needs.resolve-source.outputs.nvke_commit }}
          path: .nvkr/source-contract/nvke
          token: ${{ secrets.NKE_SOURCE_TOKEN }}
          persist-credentials: false
      - name: Set up pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Compile and check the same-revision NVKE handoff
        env:
          GOTOOLCHAIN: local
          GOENV: 'off'
          GOWORK: 'off'
          GOFLAGS: -mod=readonly
          NVKR_NVKE_SOURCE_COMMIT: ${{ needs.resolve-source.outputs.nvke_commit }}
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE"
          cd "$root/.nvkr/source-contract/nvke/cli"
          go build -o "$RUNNER_TEMP/nvkectl-nightly" ./cmd/nvkectl
          cd "$root"
          NVKR_NVKE_SOURCE_CONTRACT="$root/.nvkr/source-contract/nvke" \
          NVKR_NVKE_SOURCE_CLI="$RUNNER_TEMP/nvkectl-nightly" \
          NVKR_NVKE_NIGHTLY_SOURCE_CONTRACT="$root/.nvkr/source-contract/nvke" \
            go test ./internal/nvkedemo -run '^TestNightly(Beta(Site|.*Handoff)|SeedCurrentSourceContract)' -count=1 -timeout=5m
          cd "$root/.nvkr/source-contract/nvke/controller/test/e2e"
          go test . -run '^TestUnit_' -count=1 -timeout=10m

  select:
    needs: [resolve-source]
    if: github.repository == 'dsx-ai-factory/nvkr' && github.ref == 'refs/heads/main' && !inputs.source_contract_only && !inputs.hosted_preflight_only
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.profiles.outputs.matrix }}
    steps:
      - name: Check out the exact coordinator source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select maintained nightly projects
        id: profiles
        env:
          PROFILE: ${{ inputs.profile || 'all' }}
          NVKE_COMMIT: ${{ needs.resolve-source.outputs.nvke_commit }}
        run: |
          set -euo pipefail
          [[ "$NVKE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          jq --arg profile "$PROFILE" --arg nvke "$NVKE_COMMIT" '
            [.[] | select($profile == "all" or .name == $profile) |
              {name, nvke_commit:$nvke, runtime_target, network}]
          ' inputs/testing/nightly-profiles.json > "$RUNNER_TEMP/nightly-selection.json"
          matrix=$(jq -ce --arg profile "$PROFILE" --arg nvke "$NVKE_COMMIT" '
            [.[] | select($profile == "all" or .name == $profile)] |
            if length > 0 and all(.[];
              ((.name == "nvke-nightly-arm64" and .runtime_target == "native-arm64-vm") or
                (.name == "nvke-nightly-amd64" and .runtime_target == "native-amd64-vm")) and
              (has("harness_commit") | not) and
              .network == "ovn") and
              (map(.name) | length == (unique | length)) then
              {include: map({name, nvke_commit:$nvke, runtime_target})}
            else error("invalid maintained nightly profile") end
          ' inputs/testing/nightly-profiles.json)
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
      - name: Preserve public nightly selection report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: nightly-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nightly-selection.json
          if-no-files-found: warn
          retention-days: 7

  build:
    name: Build and publish ${{ matrix.name }}
    needs: [select]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - name: Check out the exact coordinator source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Dispatch and join this project's exact producer Run
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE: ${{ matrix.name }}
          NVKE_COMMIT: ${{ matrix.nvke_commit }}
        run: |
          set -euo pipefail
          bash scripts/nightly-build.sh inputs/testing/nightly-profiles.json "$PROFILE" \
            "$RUNNER_TEMP/nightly-build-$PROFILE"
      - name: Preserve exact producing Run facts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: nightly-build-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nightly-build-${{ matrix.name }}/build.json
          if-no-files-found: warn
          retention-days: 7

  select-runtime:
    name: Select completed candidates for runtime tests
    needs: [select, build]
    if: always() && needs.select.result == 'success' && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.completed.outputs.matrix }}
      available: ${{ steps.completed.outputs.available }}
    steps:
      - name: Select only this cycle's available producer locators
        id: completed
        env:
          GH_TOKEN: ${{ github.token }}
          MATRIX: ${{ needs.select.outputs.matrix }}
        run: |
          set -euo pipefail
          selected='[]'
          profiles=$(jq -er '
            if (.include | type) == "array" and (.include | length) > 0 and
              all(.include[];
                ((.name == "nvke-nightly-arm64" and .runtime_target == "native-arm64-vm") or
                  (.name == "nvke-nightly-amd64" and .runtime_target == "native-amd64-vm")) and
                (.nvke_commit | type == "string" and test("^[0-9a-f]{40}$"))) and
              (.include | map(.nvke_commit) | unique | length) == 1 and
              (.include | map(.name) | length == (unique | length)) then
              .include[].name
            else error("invalid maintained runtime matrix") end
          ' <<<"$MATRIX")
          while IFS= read -r profile; do
            artifact="nightly-build-$profile-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            facts=$(gh api --hostname github.com -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$artifact&per_page=100")
            available=$(jq -er --arg name "$artifact" --arg sha "$GITHUB_SHA" '
              if .total_count == 0 and (.artifacts | length) == 0 then "false"
              elif .total_count == 1 and (.artifacts | length) == 1 and
                .artifacts[0].name == $name and .artifacts[0].expired == false and
                .artifacts[0].workflow_run.head_sha == $sha then "true"
              else error("invalid exact-cycle producer locator") end
            ' <<<"$facts")
            if [[ "$available" == true ]]; then
              selected=$(jq -c --arg profile "$profile" '. + [$profile]' <<<"$selected")
            fi
          done <<<"$profiles"
          matrix=$(jq -ce --argjson selected "$selected" \
            '{include: [.include[] | select(.name as $name | $selected | index($name))]}' <<<"$MATRIX")
          printf 'matrix=%s\navailable=%s\n' "$matrix" \
            "$(jq -r '.include | length > 0' <<<"$matrix")" >> "$GITHUB_OUTPUT"

  runtime-test:
    name: Test published ${{ matrix.name }}
    needs: [select-runtime]
    if: needs.select-runtime.result == 'success' && needs.select-runtime.outputs.available == 'true' && !cancelled()
    runs-on: ${{ matrix.runtime_target == 'native-amd64-vm' && 'ubuntu-24.04' || 'arc-arm64-kvm' }}
    environment: ${{ matrix.runtime_target == 'native-amd64-vm' && 'nvkr-release' || 'nvkr-arc' }}
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    env:
      NATIVE_ARCH: ${{ matrix.runtime_target == 'native-amd64-vm' && 'amd64' || 'arm64' }}
      COSIGN_DIGEST: ${{ matrix.runtime_target == 'native-amd64-vm' && '4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71' || 'c5d324e091826b0d7a78eb16fef316450b4eb9aaec045611c08ba06f5e73220a' }}
    concurrency:
      group: nvkr-nightly-${{ matrix.runtime_target }}-runtime
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.select-runtime.outputs.matrix) }}
    steps:
      - name: Check out the exact coordinator source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up the repository's Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Prepare the ephemeral hosted AMD64 VM host
        if: matrix.runtime_target == 'native-amd64-vm'
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(uname -s)/$(uname -m)" = Linux/x86_64
          sudo -n timeout --kill-after=10s 180s apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update
          sudo -n timeout --kill-after=10s 600s apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 \
            install --no-install-recommends -y qemu-system-x86 qemu-utils ovmf libvirt-daemon-system \
            libvirt-clients cloud-image-utils genisoimage dnsmasq-base iptables ethtool \
            build-essential libcap2-bin swtpm swtpm-tools e2fsprogs sshpass
          sudo -n chmod 0666 /dev/kvm
          sudo -n systemctl start libvirtd
          sudo -n install -d -m 0700 -o "$(id -u)" -g "$(id -g)" "/run/user/$(id -u)"
          # Mirror the source-owned CI watch limits before kind starts.
          for setting in fs.inotify.max_user_instances=1024 fs.inotify.max_user_watches=1048576; do
            key=${setting%=*} floor=${setting#*=}
            if (( $(sysctl -n "$key") < floor )); then sudo -n sysctl -w "$setting"; fi
          done
      - name: Build the existing network privilege probe
        env:
          GOTOOLCHAIN: local
        run: |
          make demo
          CGO_ENABLED=0 go build -trimpath -o nvkr-exec ./cmd/nvkr
      - name: Admit the configured native runtime host
        env:
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          test "$(go env GOOS)/$(go env GOARCH)" = "linux/$NATIVE_ARCH"
          qemu='qemu-system-aarch64'
          if [[ "$NATIVE_ARCH" == amd64 ]]; then
            test "$RUNNER_ENVIRONMENT" = github-hosted
            qemu='qemu-system-x86_64'
          fi
          for tool in bash git gh jq curl timeout sha256sum docker sudo qemu-img \
            "$qemu" cloud-localds virsh ip iptables dnsmasq setcap getcap ps sysctl \
            swtpm flock setsid openssl ss make awk df sort seq; do
            command -v "$tool" >/dev/null || { echo "::error::Missing native host prerequisite: $tool"; exit 1; }
          done
          test -c /dev/kvm && test -r /dev/kvm && test -w /dev/kvm
          exec 3<>/dev/kvm
          exec 3>&-
          docker_platform=$(timeout --kill-after=5s 30s docker info --format '{{.OSType}}/{{.Architecture}}')
          case "$NATIVE_ARCH:$docker_platform" in
            arm64:linux/aarch64|arm64:linux/arm64|amd64:linux/x86_64|amd64:linux/amd64) ;;
            *) echo '::error::Docker must use the selected native Linux host'; exit 1 ;;
          esac
          test ! -e .nightly-private && test ! -L .nightly-private
          install -d -m 0700 .nightly-private
      - name: Download this cycle's exact producing Run locator
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: nightly-build-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .nightly-private/build
      - name: Select this cycle's producer and planning policy
        id: candidate
        env:
          PROFILE: ${{ matrix.name }}
          NVKE_COMMIT: ${{ matrix.nvke_commit }}
        run: |
          set -euo pipefail
          producer=$(jq -er --arg profile "$PROFILE" --arg sha "$GITHUB_SHA" \
            --arg nvke "$NVKE_COMMIT" --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" '
            if .profile.name == $profile and .sourceCommit == $sha and .nvkeCommit == $nvke and
              ($nvke | test("^[0-9a-f]{40}$")) and
              .coordinatorRun == $run and .coordinatorAttempt == $attempt and
              .producerAttempt == 1 and (.producerRun | type) == "number" and
              .producerRun > 0 and .producerRun <= 9007199254740991 and
              (.producerRun | floor) == .producerRun then .producerRun
            else error("invalid exact-cycle producer") end
          ' .nightly-private/build/build.json)
          environment=$(jq -er --arg profile "$PROFILE" \
            '[.[] | select(.name == $profile)] | if length == 1 then .[0].environment else error("invalid profile") end' \
            inputs/testing/nightly-profiles.json)
          runtime=$(jq -er 'if .githubRuntimePlan == true and
            .githubRuntimeSource.repository == "https://github.com/dsx-ai-factory/nvke" and
            .githubRuntimeSource.ref == "refs/heads/main" then "true"
            else error("nightly requires the exact runtime NVKE main policy") end' "$environment")
          printf 'producer_run=%s\nruntime_plan=%s\n' "$producer" "$runtime" >> "$GITHUB_OUTPUT"
      - name: Download the producer's frozen runtime inputs
        if: steps.candidate.outputs.runtime_plan == 'true'
        uses: ./.github/nvkr-run/actions/ci-download
        env:
          NVKR_CI_STORAGE_READ_USER: ${{ vars.NVKR_CI_STORAGE_READ_USER }}
        with:
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
          name: nvkr-runtime-inputs
          run-id: ${{ steps.candidate.outputs.producer_run }}
          attempt: '1'
          path: .nightly-private/runtime-inputs
      - name: Select the suite revision from the frozen product sources
        id: suite
        env:
          RUNTIME_PLAN: ${{ steps.candidate.outputs.runtime_plan }}
          NVKE_COMMIT: ${{ matrix.nvke_commit }}
          PROFILE: ${{ matrix.name }}
        run: |
          set -euo pipefail
          [[ "$RUNTIME_PLAN" == true && "$NVKE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          controller=$(jq -er --arg profile "$PROFILE" \
            '.[] | select(.name == $profile) | .controller_output // "cwe"' inputs/testing/nightly-profiles.json)
          suite=$(jq -er --arg controller "$controller" --arg nvke "$NVKE_COMMIT" '
            . as $plan |
            if .environment.githubRuntimePlan == true and .runtimeSourceCommit == $nvke and
              .environment.githubRuntimeSource.repository == "https://github.com/dsx-ai-factory/nvke" and
              .environment.githubRuntimeSource.ref == "refs/heads/main" and
              all(.builds[].resolvedComponents[];
                if .fromSource == true and (.repo | test("^https://github[.]com/dsx-ai-factory/nvke([.]git)?$"))
                then .commit == $nvke else true end) then .
            else error("frozen products differ from the selected NVKE main revision") end |
            {nvkectl:"nvkectl", ($controller):"nvke-controller",
              "controller-chart":"nvke-controller-chart", nktp:"nktp-chart"} as $roles |
            if ($roles | length) == 4 then [.builds[] | select($roles[.name] != null)]
            else error("NVKE source roles must be disjoint") end |
              if length == 4 and (map(.name) | sort) == ($roles | keys) and
                all(.[]; (.resolvedComponents | length) == 1 and
                  .resolvedComponents[0].Name == $roles[.name]) then
                map(.resolvedComponents[0])
              else error("ambiguous site producers") end |
              if all(.[]; .fromSource == true and
                (.repo | test("^https://github[.]com/dsx-ai-factory/nvke([.]git)?$")) and
                (.commit | test("^[0-9a-f]{40}$"))) and
                all(.[]; .commit == $nvke) then $plan.runtimeSourceCommit
              else error("site products require one exact NVKE suite revision") end
            ' .nightly-private/runtime-inputs/plan.json)
          [[ "$suite" =~ ^[0-9a-f]{40}$ ]]
          printf 'commit=%s\n' "$suite" >> "$GITHUB_OUTPUT"
      - name: Check out the pinned NVKE end-to-end suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: dsx-ai-factory/nvke
          ref: ${{ steps.suite.outputs.commit }}
          token: ${{ secrets.NKE_SOURCE_TOKEN }}
          path: .nightly-private/nvke
          fetch-depth: 1
          persist-credentials: false
      - name: Fetch and check the independent native verifier
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/nightly-cosign-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$destination" && test ! -L "$destination"
          install -d -m 0700 "$destination"
          curl --fail --location --proto '=https' --proto-redir '=https' --connect-timeout 20 \
            --max-time 180 --max-filesize 134217728 \
            --output "$destination/cosign" \
            "https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-linux-$NATIVE_ARCH"
          printf '%s  %s\n' "$COSIGN_DIGEST" "$destination/cosign" | sha256sum -c -
          chmod 0500 "$destination/cosign"
          printf 'NVKR_NIGHTLY_COSIGN=%s\n' "$destination/cosign" >> "$GITHUB_ENV"
          printf 'NVKR_NIGHTLY_COSIGN_DIGEST=sha256:%s\n' "$COSIGN_DIGEST" >> "$GITHUB_ENV"
      - name: Authenticate the publication and run the existing NVKE Go suite
        env:
          GOTOOLCHAIN: local
          GH_TOKEN: ${{ github.token }}
          NVKR_REGISTRY_READ: ${{ secrets.NVKR_REGISTRY_READ }}
          NVKR_REGISTRY_READ_USER: ${{ vars.NVKR_REGISTRY_READ_USER }}
          NVKR_NIGHTLY_ENABLE: '1'
          NVKR_CI_STORAGE_TOKEN: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
          NVKR_CI_STORAGE_USER: ${{ vars.NVKR_CI_STORAGE_READ_USER }}
          NVKR_NIGHTLY_PROFILE: ${{ matrix.name }}
          NVKR_NVKE_SOURCE_COMMIT: ${{ matrix.nvke_commit }}
          NVKR_NIGHTLY_PROFILES: ${{ github.workspace }}/inputs/testing/nightly-profiles.json
          NVKR_NIGHTLY_BUILD: ${{ github.workspace }}/.nightly-private/build/build.json
          NVKR_NIGHTLY_SOURCE: ${{ github.workspace }}/.nightly-private/nvke
          NVKR_NIGHTLY_NETWORK_HELPER: ${{ github.workspace }}/bin/nvke-demo
          NVKR_NIGHTLY_WORKSPACE: ${{ runner.temp }}/nightly-candidate-${{ matrix.name }}
          NVKR_NIGHTLY_REPORTS: ${{ runner.temp }}/nightly-reports-${{ matrix.name }}
        run: |
          set -euo pipefail
          go test ./internal/nvkedemo -list '^TestNightlyPublishedCandidate$' \
            | grep -Fx TestNightlyPublishedCandidate
          go test ./internal/nvkedemo -run '^TestNightlyPublishedCandidate$' -timeout 330m -count=1 -v
          jq -e --arg profile "$NVKR_NIGHTLY_PROFILE" --arg run "$GITHUB_RUN_ID" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" --arg sha "$GITHUB_SHA" --arg nvke "$NVKR_NVKE_SOURCE_COMMIT" '
            .profile == $profile and .phase == "runtime" and .runtimePassed == true and
            .coordinatorRun == $run and .coordinatorAttempt == $attempt and
            .sourceCommit == $sha and .nvkeCommit == $nvke and .qualificationAuthority == "none"
          ' "$NVKR_NIGHTLY_REPORTS/cycle.json" >/dev/null
      - name: Record final aggregate host capacity
        if: always() && matrix.runtime_target == 'native-amd64-vm'
        run: |
          free -m
          df -Pm "$RUNNER_TEMP"
      - name: Preserve the public runtime verdict
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: nightly-runtime-report-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nightly-reports-${{ matrix.name }}/cycle.json
          if-no-files-found: warn
          retention-days: 7
