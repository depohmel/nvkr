---
name: NVKR nightly NVKE end-to-end tests

'on':
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      tenant_checks:
        description: Also create a tenant and check workload and DNS after the site smoke test
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nvkr-nightly-main
  cancel-in-progress: false

jobs:
  resolve-source:
    if: github.repository == 'dsx-ai-factory/nvkr' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      nvke_commit: ${{ steps.source.outputs.nvke_commit }}
    steps:
      - name: Resolve NVKE main once for this nightly cycle
        id: source
        env:
          GH_TOKEN: ${{ secrets.NKE_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?NVKE source resolution requires its read credential}"
          source=$(timeout --kill-after=5s 60s gh api --hostname github.com \
            -H 'X-GitHub-Api-Version: 2026-03-10' repos/dsx-ai-factory/nvke/git/ref/heads/main)
          commit=$(jq -er '
            if .ref == "refs/heads/main" and .object.type == "commit" and
              (.object.sha | type == "string" and test("^[0-9a-f]{40}$")) then .object.sha
            else error("invalid exact NVKE main revision") end' <<<"$source")
          printf 'nvke_commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"

  e2e:
    name: Build and bootstrap NVKE (${{ matrix.arch }})
    needs: [resolve-source]
    runs-on: ${{ matrix.runner }}
    environment: ${{ matrix.environment }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            environment: nvkr-release
          - arch: arm64
            runner: arc-arm64-kvm
            environment: nvkr-arc
    env:
      GOTOOLCHAIN: local
      NVKR_NVKE_SOURCE_COMMIT: ${{ needs.resolve-source.outputs.nvke_commit }}
      NVKR_NVKE_E2E: '1'
      NVKR_NVKE_E2E_TENANT: ${{ inputs.tenant_checks && '1' || '0' }}
    steps:
      - name: Reserve time for Go cleanup and the job verdict
        run: |
          set -euo pipefail
          printf 'NVKR_JOB_DEADLINE=%s\n' "$(( $(date +%s) + 355 * 60 ))" >> "$GITHUB_ENV"
      - name: Check out NVKR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up the repository's Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Build NVKR and the existing network helper
        timeout-minutes: 20
        run: |
          set -euo pipefail
          timeout --kill-after=10s 1100s make build demo
      - name: Read the catalog's exact identity-helper source pin
        id: helper
        timeout-minutes: 2
        run: |
          set -euo pipefail
          pin=$(timeout --kill-after=5s 60s bin/nvkr catalog source-pin \
            --data inputs/catalogs/tools/native nvkr-site-identity)
          commit=$(jq -er '.commit | select(type == "string" and test("^[0-9a-f]{40}$"))' <<< "$pin")
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
      - name: Check out the cycle's exact NVKE source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dsx-ai-factory/nvke
          ref: ${{ needs.resolve-source.outputs.nvke_commit }}
          path: .nvkr/nightly-sources/nvke
          token: ${{ secrets.NKE_SOURCE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the private NVIDIA OVN source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dsx-ai-factory/ovn-kubernetes
          path: .nvkr/nightly-sources/ovn
          token: ${{ secrets.NKE_SOURCE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the identity helper's exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dsx-ai-factory/nvkr
          ref: ${{ steps.helper.outputs.commit }}
          path: .nvkr/nightly-sources/nvkr-helper
          token: ${{ secrets.NKE_SOURCE_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
      - name: Bind private source transport to the local checkouts
        run: |
          set -euo pipefail
          {
            printf 'GIT_CONFIG_COUNT=6\n'
            printf 'GIT_CONFIG_KEY_0=url.%s/.nvkr/nightly-sources/nvke.insteadOf\n' "$GITHUB_WORKSPACE"
            printf 'GIT_CONFIG_VALUE_0=https://github.com/dsx-ai-factory/nvke.git\n'
            printf 'GIT_CONFIG_KEY_1=url.%s/.nvkr/nightly-sources/nvke.insteadOf\n' "$GITHUB_WORKSPACE"
            printf 'GIT_CONFIG_VALUE_1=https://github.com/dsx-ai-factory/nvke\n'
            printf 'GIT_CONFIG_KEY_2=url.%s/.nvkr/nightly-sources/ovn.insteadOf\n' "$GITHUB_WORKSPACE"
            printf 'GIT_CONFIG_VALUE_2=https://github.com/dsx-ai-factory/ovn-kubernetes.git\n'
            printf 'GIT_CONFIG_KEY_3=url.%s/.nvkr/nightly-sources/ovn.insteadOf\n' "$GITHUB_WORKSPACE"
            printf 'GIT_CONFIG_VALUE_3=https://github.com/dsx-ai-factory/ovn-kubernetes\n'
            printf 'GIT_CONFIG_KEY_4=url.%s/.nvkr/nightly-sources/nvkr-helper.insteadOf\n' "$GITHUB_WORKSPACE"
            printf 'GIT_CONFIG_VALUE_4=https://github.com/dsx-ai-factory/nvkr.git\n'
            printf 'GIT_CONFIG_KEY_5=url.%s/.nvkr/nightly-sources/nvkr-helper.insteadOf\n' "$GITHUB_WORKSPACE"
            printf 'GIT_CONFIG_VALUE_5=https://github.com/dsx-ai-factory/nvkr\n'
          } >> "$GITHUB_ENV"
      - name: Prepare the ephemeral hosted AMD64 VM host
        if: matrix.arch == 'amd64'
        timeout-minutes: 15
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(uname -s)/$(uname -m)" = Linux/x86_64
          sudo -n timeout --kill-after=10s 180s apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update
          sudo -n timeout --kill-after=10s 600s apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 \
            install --no-install-recommends -y qemu-system-x86 qemu-utils ovmf libvirt-daemon-system \
            libvirt-clients cloud-image-utils genisoimage dnsmasq-base iptables ethtool \
            build-essential libcap2-bin swtpm swtpm-tools e2fsprogs sshpass \
            gnutls-bin ipxe-qemu openssh-client
          sudo -n timeout --kill-after=5s 15s chmod 0666 /dev/kvm
          sudo -n timeout --kill-after=5s 30s systemctl start libvirtd
          sudo -n timeout --kill-after=5s 15s install -d -m 0700 -o "$(id -u)" -g "$(id -g)" "/run/user/$(id -u)"
          for setting in fs.inotify.max_user_instances=1024 fs.inotify.max_user_watches=1048576; do
            key=${setting%=*} floor=${setting#*=}
            if (( $(sysctl -n "$key") < floor )); then sudo -n timeout --kill-after=5s 15s sysctl -w "$setting"; fi
          done
      - name: Build the pinned temporary bootstrap backend from source
        if: matrix.arch == 'amd64'
        timeout-minutes: 20
        env:
          GOENV: 'off'
          GOWORK: 'off'
        run: |
          set -euo pipefail
          umask 077
          source="$RUNNER_TEMP/nightly-lima-source"
          prefix="$RUNNER_TEMP/nightly-lima"
          test ! -e "$source" && test ! -L "$source"
          test ! -e "$prefix" && test ! -L "$prefix"
          git init "$source"
          git -C "$source" remote add origin https://github.com/lima-vm/lima.git
          timeout --kill-after=10s 180s git -C "$source" fetch --depth=1 origin f47461ed7d03f300297e01fd659e9aefc6c228b9
          git -C "$source" checkout --detach FETCH_HEAD
          test "$(git -C "$source" rev-parse HEAD)" = f47461ed7d03f300297e01fd659e9aefc6c228b9
          test "$(git -C "$source" rev-parse 'HEAD^{tree}')" = 525cd5017b050291ab824892d624bbbacf7f8e7e
          timeout --kill-after=30s 900s make -C "$source" native documentation install PREFIX="$prefix"
          install -m 0644 "$source/NOTICE" "$prefix/share/doc/lima/NOTICE"
          test "$("$prefix/bin/limactl" --version)" = 'limactl version f47461e'
          test -x "$prefix/bin/nerdctl.lima"
          printf '%s\n' "$prefix/bin" >> "$GITHUB_PATH"
      - name: Select the existing private toolchain images
        timeout-minutes: 5
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          umask 077
          timeout --kill-after=10s 240s bin/nvkr run plan \
            --definition "inputs/definitions/demo/$ARCH-nvidia-local-kvm.json" \
            --environment "inputs/environments/local-$ARCH-kvm.json" --json \
            > "$RUNNER_TEMP/nightly-toolchains.json"
      - name: Pull private toolchains with the independent registry reader
        timeout-minutes: 10
        env:
          ARCH: ${{ matrix.arch }}
          GHCR_USER: ${{ vars.NVKR_REGISTRY_READ_USER }}
          GHCR_TOKEN: ${{ secrets.NVKR_REGISTRY_READ }}
        run: |
          set -euo pipefail
          DOCKER_CONFIG=$(mktemp -d "$RUNNER_TEMP/nightly-pull.XXXXXX")
          export DOCKER_CONFIG
          trap 'find "$DOCKER_CONFIG" -depth -delete' EXIT
          printf '%s' "$GHCR_TOKEN" | timeout --kill-after=5s 30s \
            docker login ghcr.io --username "$GHCR_USER" --password-stdin
          images=$(jq -er '[.builds[].executionGraph.nodes[] | .toolchain // empty |
            select(startswith("ghcr.io/"))] | unique |
            if length > 0 and all(.[]; startswith("ghcr.io/dsx-ai-factory/nvkr/") and
              test("@sha256:[0-9a-f]{64}$")) then .[] else error("invalid private toolchains") end' \
            "$RUNNER_TEMP/nightly-toolchains.json")
          while IFS= read -r image; do
            timeout --kill-after=10s 240s docker pull --platform "linux/$ARCH" "$image"
          done <<< "$images"
      - name: Build and bootstrap through the NVKR Go integration test
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          umask 077
          test "$(go env GOOS)/$(go env GOARCH)" = "linux/$ARCH"
          config="$RUNNER_TEMP/nightly-e2e.yaml"
          cat > "$config" <<EOF
          version: 1
          build:
            repo: "$GITHUB_WORKSPACE"
            definition: inputs/definitions/demo/$ARCH-nvidia-local-kvm.json
            environment: inputs/environments/local-$ARCH-kvm.json
            nvkr: bin/nvkr
            attempt: nightly-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$ARCH
            jobs: 1
          run:
            out: "$RUNNER_TEMP/nightly-site-$ARCH"
            network: ovn
            cleanup: true
            timeoutSeconds: 3600
            resources:
              siteMemoryGiB: 4
              tenantMemoryGiB: 4
              headroomMiB: 1024
              vcpus: 4
          EOF
          [[ "$NVKR_JOB_DEADLINE" =~ ^[0-9]+$ ]]
          remaining=$(( NVKR_JOB_DEADLINE - $(date +%s) ))
          # The Go lifecycle reserves two hours for joined VM/network cleanup.
          (( remaining > 2 * 60 * 60 ))
          NVKR_NVKE_E2E_CONFIG="$config" NVKR_NVKE_E2E_BINARY="$GITHUB_WORKSPACE/bin/nvke-demo" \
            go test ./internal/nvkedemo -run '^TestEndToEnd$' -timeout "${remaining}s" -count=1 -v
